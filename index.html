<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#e9ecf1;--card:#ffffff;--text:#111827;--muted:#374151;--line:#b8bfcb;--ok:#2b8a3e;--accent:#e8590c;--blue:#1971c2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#f3f4f6;--muted:#c4c9d3;--line:#454b57}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:17px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#1f2937;color:#fff}
header h1{font-size:24px;margin:0}
header .status{color:#cbd5e1;font-size:14px;font-weight:normal}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header .btn{background:#374151;color:#fff;border-color:#4b5563;font-size:15px;padding:10px 14px}
header .btn.warn{background:var(--accent);border-color:var(--accent)}
header .btn.lang.on{background:#fff;color:#111827;border-color:#fff}
.badge{display:inline-block;min-width:24px;padding:1px 7px;border-radius:12px;background:#fff;color:#111827;font-size:14px;text-align:center}
.btn{border:2px solid var(--line);background:var(--card);color:var(--text);padding:12px 16px;border-radius:10px;cursor:pointer;font-size:17px;font-weight:bold}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:#c92a2a;border-color:#c92a2a;color:#fff}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:1fr 410px;gap:14px;padding:14px;height:calc(100vh - 66px)}
@media (max-width:860px){main{grid-template-columns:1fr;height:auto}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;overflow:auto}
.hint{background:color-mix(in srgb,#f59f00 22%,var(--card));border:2px solid #f59f00;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:16px;font-weight:bold}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{--cc:#495057;padding:12px 18px;border-radius:12px;border:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--card));color:var(--text);cursor:pointer;font-size:19px;font-weight:bold}
.tab.active{background:var(--cc);color:#fff}
#payTabs .tab{flex:1;font-size:17px;padding:12px 8px}
#payTabs .tab[data-p=Cash]{--cc:#2b8a3e}
#payTabs .tab[data-p=Transfer]{--cc:#1971c2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.item{--cc:#495057;border:2px solid var(--cc);border-left-width:12px;border-radius:12px;padding:12px;cursor:pointer;background:color-mix(in srgb,var(--cc) 11%,var(--card));text-align:left;color:var(--text);min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.item:hover{background:color-mix(in srgb,var(--cc) 24%,var(--card))}
.item:active{transform:scale(.97)}
.item .code{align-self:flex-start;background:var(--cc);color:#fff;font-size:14px;font-weight:bold;padding:2px 9px;border-radius:6px}
.item .name{font-size:20px;font-weight:bold;line-height:1.2}
.item .price{font-size:22px;font-weight:bold}
.item .price small{font-size:13px;font-weight:bold;color:var(--muted);margin-left:4px}
.open{border-style:dashed}
.ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ohead h3{margin:0;font-size:22px}
.row{display:flex;gap:6px}
.cart-row{--cc:#868e96;display:flex;justify-content:space-between;gap:8px;padding:10px;margin-bottom:6px;border-left:8px solid var(--cc);background:color-mix(in srgb,var(--cc) 10%,var(--card));border-radius:8px;font-size:17px}
.cart-row b{font-size:18px}
.cart-row small{color:var(--muted);font-size:14px}
.qty{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:bold;justify-content:flex-end}
.qty button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:22px;font-weight:bold}
.total{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:bold;margin:12px 0}
.total.small{font-size:20px}
#total,#payTotal{color:var(--accent)}
input[type=number],input[type=text],input[type=password],select{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:18px}
label{font-size:16px;font-weight:bold;color:var(--text);display:block;margin:12px 0 5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px}
.modal h3{margin:0 0 12px;font-size:22px}
.modal.wide{max-width:960px;max-height:92vh;overflow:auto}
.opts{display:grid;gap:10px}
.opts .btn{background:var(--cc);border-color:var(--cc);color:#fff;font-size:20px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.status{font-size:14px;color:var(--muted)}
#btnSave,#btnSavePay{font-size:19px;padding:16px 8px;flex:1}
.paybar{display:flex;gap:8px;position:sticky;bottom:-14px;background:var(--card);padding:10px 0 14px;margin-bottom:-14px;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:bold;color:#fff}
.pill.paid{background:var(--ok)}.pill.open{background:var(--accent)}.pill.void{background:#868e96}
.bill{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.bill .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px}
.bill .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bill .acts .btn{flex:1;padding:10px}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#111827;color:#fff;padding:12px 22px;border-radius:10px;font-size:18px;font-weight:bold;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.asec{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.asec h4{margin:0 0 8px;font-size:18px}
.scroll-x{overflow-x:auto}
.scroll-x input,.scroll-x select{padding:8px;font-size:16px;min-width:70px}
.adminbar{position:sticky;top:-18px;background:var(--card);padding:8px 0 10px;z-index:2;display:flex;gap:8px;justify-content:space-between;align-items:center;border-bottom:2px solid var(--line);margin-bottom:12px}
.billgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.bill.open{border-color:var(--accent);border-top-width:8px}
.btn.big{font-size:20px;padding:14px}
header .btn.navon{background:#fff;color:#111827;border-color:#fff}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.item .name{font-size:17px}.tab{font-size:17px;padding:10px 14px}}
</style>
</head>
<body>
<header>
  <h1>🍳 POS System <span class="status" id="src"></span> <span class="status" id="syncDot" style="cursor:pointer;margin-left:6px;color:#fff;font-weight:bold" title="Click to sync now"></span></h1>
  <div class="hbtns">
    <button class="btn" id="navOrder">🧾 <span data-t="New order"></span></button>
    <button class="btn warn" id="btnBills">📋 <span data-t="Open bills"></span> <span class="badge" id="billBadge">0</span></button>
    <button class="btn" id="btnStaff">👥 <span data-t="Staff"></span></button>
    <button class="btn" id="btnHist">📊 <span data-t="Sales history"></span></button>
    <button class="btn" id="btnExport">⬇️ <span data-t="Export sales (.xlsx)"></span></button>
    <button class="btn" id="btnAdmin">🔒 Admin</button>
    <span class="hbtns" style="gap:4px"><button class="btn lang" data-l="en">EN</button><button class="btn lang" data-l="mz">Mizo</button></span>
  </div>
</header>

<main id="orderView">
  <section class="panel">
    <div class="hint">① <span data-t="Pick a category"></span> &nbsp;→&nbsp; ② <span data-t="Tap a menu"></span> &nbsp;→&nbsp; ③ <span data-t="Save the bill"></span> &nbsp;→&nbsp; ④ <span data-t="Pay when ready"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="panel">
    <div class="ohead">
      <h3>🧾 <span data-t="Order"></span> <span class="status" id="orderNo"></span></h3>
      <button class="btn small" id="btnClear">🗑 <span data-t="Clear"></span></button>
    </div>
    <label style="margin-top:0">👤 <span data-t="Order taken by"></span></label>
    <div class="row" style="margin-bottom:6px"><select id="selTaker"></select><button class="btn" data-staff title="Add / edit names">＋</button></div>
    <div id="cart" style="min-height:90px"></div>
    <div class="total"><span data-t="Total"></span><span id="total">Rs 0</span></div>
    <label>📝 <span data-t="Note (optional)"></span></label>
    <input type="text" id="note" data-tp="e.g. table 5, no spicy, take away" placeholder="e.g. table 5, no spicy, take away">
    <div class="paybar">
      <button class="btn blue" id="btnSave" disabled>💾 <span data-t="Save Bill"></span></button>
      <button class="btn ok" id="btnSavePay" disabled>💰 <span data-t="Save & Pay"></span></button>
    </div>
  </aside>
</main>

<main id="billsView" style="display:none;grid-template-columns:1fr">
  <section class="panel">
    <h2 style="margin:0 0 4px;font-size:26px">📋 <span data-t="Open bills"></span> <span class="badge" id="billsCount" style="background:var(--accent);color:#fff">0</span></h2>
    <div class="status" style="margin-bottom:12px">Unpaid bills · press <b>Pay</b> when the customer is ready</div>
    <div class="billgrid" id="billsBody"></div>
  </section>
</main>

<div id="toast"></div>

<!-- Option modal -->
<div class="modal-bg" id="optModal"><div class="modal">
  <h3 id="optTitle"></h3><div class="opts" id="optList"></div>
  <button class="btn" style="margin-top:10px;width:100%" onclick="closeModals()"><span data-t="Cancel"></span></button>
</div></div>

<!-- Open item modal -->
<div class="modal-bg" id="openModal"><div class="modal">
  <h3>✏️ <span data-t="Open item"></span></h3>
  <label><span data-t="Item name (optional)"></span></label><input type="text" id="oiName" placeholder="Open item">
  <label><span data-t="Price"></span></label><input type="number" id="oiPrice" min="0" step="any" placeholder="0.00">
  <label><span data-t="Quantity"></span></label><input type="number" id="oiQty" min="1" value="1">
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" onclick="closeModals()"><span data-t="Cancel"></span></button>
    <button class="btn primary" style="flex:2" id="oiAdd"><span data-t="Add to order"></span></button>
  </div>
</div></div>

<!-- Pay modal -->
<div class="modal-bg" id="payModal"><div class="modal" style="max-width:480px;max-height:94vh;overflow:auto">
  <h3 id="payTitle"></h3>
  <div id="paySummary"></div>
  <div class="total"><span data-t="Total"></span><span id="payTotal">Rs 0</span></div>
  <label>💳 <span data-t="Payment"></span></label>
  <div class="tabs" id="payTabs" style="margin-bottom:4px">
    <button class="tab active" data-p="Cash">💵 <span data-t="Cash"></span></button>
    <button class="tab" data-p="Transfer">📱 <span data-t="Transfer"></span></button>
  </div>
  <div id="cashBox">
    <label><span data-t="Cash received"></span></label>
    <div class="row"><input type="number" id="cash" min="0" step="any" placeholder="0.00"><button class="btn" id="btnExact"><span data-t="Exact amount"></span></button></div>
    <div class="total small"><span data-t="Change"></span><span id="change">Rs 0</span></div>
  </div>
  <label>🧑‍💼 <span data-t="Cashier"></span></label>
  <div class="row"><select id="selCashier"></select><button class="btn" data-staff title="Add / edit names">＋</button></div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn" style="flex:1" onclick="closeModals()"><span data-t="Cancel"></span></button>
    <button class="btn ok" id="btnConfirmPay" style="flex:2;font-size:21px;padding:16px" disabled>✅ <span data-t="Confirm payment"></span></button>
  </div>
</div></div>

<!-- Staff modal -->
<div class="modal-bg" id="staffModal" style="z-index:20"><div class="modal" style="max-width:420px;max-height:85vh;overflow:auto">
  <h3>👥 <span data-t="Staff names"></span></h3><div id="staffBody"></div>
  <button class="btn" style="margin-top:12px;width:100%" onclick="$('staffModal').style.display='none'"><span data-t="Done"></span></button>
</div></div>

<!-- History modal -->
<div class="modal-bg" id="histModal"><div class="modal" style="max-width:680px;max-height:88vh;overflow:auto">
  <h3>📊 <span data-t="Sales history"></span></h3><div id="histBody"></div>
  <button class="btn" style="margin-top:12px;width:100%" onclick="closeModals()"><span data-t="Close"></span></button>
</div></div>

<!-- PIN modal -->
<div class="modal-bg" id="pinModal" style="z-index:20"><div class="modal" style="max-width:340px">
  <h3>🔒 Admin</h3>
  <label>PIN</label><input type="password" id="pinInput" inputmode="numeric" autocomplete="off">
  <div id="pinErr" style="color:#c92a2a;font-weight:bold;min-height:22px;margin-top:6px"></div>
  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn" style="flex:1" onclick="$('pinModal').style.display='none'">Cancel</button>
    <button class="btn primary" style="flex:2" id="pinOk">Unlock</button>
  </div>
</div></div>

<!-- Admin modal -->
<div class="modal-bg" id="adminModal"><div class="modal wide">
  <div class="adminbar">
    <h3 style="margin:0">⚙️ Admin</h3>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="closeModals()">Close</button>
      <button class="btn ok" id="adminSave">💾 Save changes</button>
    </div>
  </div>
  <div id="adminBody"></div>
  <input type="file" id="file" accept=".xlsx,.xls" hidden>
</div></div>

<script>
// ====================== Helpers ======================
const $ = id => document.getElementById(id);
const money = n => { n = Number(n||0); return 'Rs ' + (Number.isInteger(n) ? n : n.toFixed(2)); };
const load = (k,d) => { try { const v = JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined) ? d : v; } catch(e){ return d; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
function escH(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function toast(msg){ const el=$('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',2500); }
function closeModals(){ document.querySelectorAll('.modal-bg').forEach(m=>m.style.display='none'); }
document.querySelectorAll('.modal-bg').forEach(m=>m.onclick=e=>{ if(e.target===m) m.style.display='none'; });


// ====================== Cloud sync (Google Sheets via Apps Script) ======================
function applySetupLink(){
  const m = location.hash.match(/^#setup=(.+)$/); if(!m) return false;
  try{ const o = JSON.parse(atob(decodeURIComponent(m[1]))); if(o.u && o.k) save('pos_sync',{url:o.u,key:o.k}); }catch(e){}
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  return true;
}
applySetupLink();
window.addEventListener('hashchange',()=>{ if(applySetupLink()) location.reload(); });
const CFG = (window.POS_CONFIG && window.POS_CONFIG.syncUrl && window.POS_CONFIG.syncKey)
  ? {url:String(window.POS_CONFIG.syncUrl).trim(), key:String(window.POS_CONFIG.syncKey).trim()} : null;
let sync = CFG || load('pos_sync',null);
const syncManaged = !!CFG;   // true = connection comes from config.js (same for every device)          // {url,key} or null = local only
let outbox = load('pos_outbox',[]);        // ids of bills waiting to be pushed
let lastPull = load('pos_lastpull',0);
let menuDirty = load('pos_menu_dirty',false);
let staffDirty = load('pos_staff_dirty',false);
let sheetPin = load('pos_sheet_pin','');
let lastReconcile = 0;
function markStaff(){ if(!sync) return; staffDirty = true; save('pos_staff_dirty',true); kickSync(); }
let syncBusy = false, syncErr = '';
function newId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function queueBill(id){ if(!outbox.includes(id)){ outbox.push(id); save('pos_outbox',outbox); } }
function dequeue(id){ outbox = outbox.filter(x=>x!==id); save('pos_outbox',outbox); }
function touchBill(b){ b.rev = (b.rev||0)+1; queueBill(b.id); }
function setSyncState(){
  const el = $('syncDot'); if(!el) return;
  if(!sync){ el.textContent='⚪ Local only'; el.title='Not connected to Google Sheets (Admin → Google Sheets sync)'; return; }
  if(syncErr){ el.textContent='🔴 '+(navigator.onLine?'Sync error':'Offline')+(outbox.length?' · '+outbox.length+' waiting':''); el.title=syncErr; return; }
  el.textContent = outbox.length ? '🟡 '+outbox.length+' waiting' : '🟢 Synced'; el.title='Click to sync now';
}
async function api(action,payload,method){
  if(!sync) throw new Error('Not connected');
  const ctrl = new AbortController(), to = setTimeout(()=>ctrl.abort(),15000);
  try{
    let res;
    if(method==='POST'){
      res = await fetch(sync.url+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(Object.assign({action,key:sync.key},payload||{})),signal:ctrl.signal});
    } else {
      const q = new URLSearchParams(Object.assign({action,key:sync.key,_:Date.now()},payload||{}));
      res = await fetch(sync.url+'?'+q.toString(),{signal:ctrl.signal});
    }
    const j = await res.json();
    if(j.error) throw new Error(j.error);
    return j;
  } finally { clearTimeout(to); }
}
async function allocateNo(){
  if(sync){ try{ const r = await api('nextNo',{},'POST'); if(r.no){ save('pos_counter',Math.max(load('pos_counter',0),r.no)); return r.no; } }catch(e){} }
  const n = nextNo(); save('pos_counter',n); return n;
}
function adoptServerBill(sb){
  const i = bills.findIndex(b=>b.id===sb.id);
  if(i<0){ bills.push(sb); return true; }
  const lb = bills[i];
  if(sb.rev>lb.rev || (lb.status==='open' && sb.status!=='open')){ bills[i]=sb; dequeue(sb.id); return true; }
  return false;
}
async function flushOutbox(){
  for(const id of [...outbox]){
    const b = bills.find(x=>x.id===id); if(!b){ dequeue(id); continue; }
    const sent = b.rev;
    const r = await api('upsertBill',{bill:b},'POST');
    if(r.rejected){ if(r.bill) adoptServerBill(r.bill); dequeue(id); save('pos_bills',bills); }
    else if(b.rev===sent) dequeue(id);
  }
}
async function pullBills(){
  const r = await api('bills',{since:lastPull},'GET');
  let changed = false;
  (r.bills||[]).forEach(sb=>{ if(adoptServerBill(sb)) changed = true; });
  lastPull = Math.max(0,(r.serverTime||Date.now())-3000); save('pos_lastpull',lastPull);
  if(changed){
    save('pos_bills',bills); save('pos_counter',Math.max(load('pos_counter',0),...bills.map(b=>b.no||0)));
    updateBadge(); if(view==='bills') renderBills();
  }
}
async function loadSheetMenu(){
  if(menuDirty) return 'dirty';
  const r = await api('menu',{},'GET');
  if(r.pin){ sheetPin = r.pin; save('pos_sheet_pin',sheetPin); }
  if(!r.menu || !r.menu.length) return 'empty';
  menu = r.menu; if(r.options && r.options.length) options = r.options;
  fileLabels = r.labels||{}; localLabels = {}; save('pos_labels',localLabels);
  if(!staffDirty && r.staff && r.staff.takers && r.staff.takers.length && r.staff.cashiers && r.staff.cashiers.length){ staff = r.staff; renderStaffSelects(); }
  save('pos_menu_cache',{menu,options,labels:fileLabels});
  return 'ok';
}
async function pushMenu(){
  mergeLabels();
  await api('saveMenu',{menu,options,labels},'POST');
  menuDirty = false; save('pos_menu_dirty',false);
  save('pos_menu_cache',{menu,options,labels:fileLabels});
}
async function reconcileBills(){   // the sheet is the single source of truth: drop bills that no longer exist there
  const r = await api('billIds',{},'GET'); const ids = new Set(r.ids||[]);
  const before = bills.length;
  bills = bills.filter(b=>ids.has(b.id) || outbox.includes(b.id));
  if(bills.length!==before){
    if(editingId && !bills.some(b=>b.id===editingId)){ cart=[]; editingId=null; $('note').value=''; }
    save('pos_bills',bills); updateBadge(); renderCart(); if(view==='bills') renderBills();
  }
}
async function syncNow(){
  if(!sync || syncBusy) return;
  syncBusy = true;
  try{ if(menuDirty) await pushMenu();
    if(staffDirty){ await api('saveStaff',{staff},'POST'); staffDirty=false; save('pos_staff_dirty',false); }
    await flushOutbox(); await pullBills();
    if(Date.now()-lastReconcile>60000){ await reconcileBills(); lastReconcile=Date.now(); }
    syncErr=''; }
  catch(e){ syncErr = String((e&&e.message)||e); }
  finally{ syncBusy = false; setSyncState(); }
}

function needXLSX(){ if(typeof XLSX==='undefined'){ alert('Excel library could not load. Check your internet connection.'); return true; } return false; }
function parseWorkbook(wb){
  const m = XLSX.utils.sheet_to_json(wb.Sheets['Menu']||wb.Sheets[wb.SheetNames[0]]);
  const parsed = m.filter(r=>r.Code).map(r=>({
    code:String(r.Code).trim(), category:String(r.Category||'').trim(),
    name:String(r.Name===undefined?'':r.Name).trim(), price:Number(r.Price)||0,
    hasOptions:String(r.HasOptions||'N').trim().toUpperCase().startsWith('Y'), variants:[]
  }));
  if(wb.Sheets['Variants']) XLSX.utils.sheet_to_json(wb.Sheets['Variants']).forEach(r=>{
    const it = parsed.find(x=>x.code===String(r.Code).trim());
    if(it && r.Variant!==undefined && r.Variant!=='' && !isNaN(Number(r.Price))) it.variants.push({name:String(r.Variant).trim(),price:Number(r.Price)});
  });
  let o = wb.Sheets['Options'] ? XLSX.utils.sheet_to_json(wb.Sheets['Options']).filter(r=>r.Option)
    .map(r=>({name:String(r.Option).trim(), extra:Number(r.ExtraPrice)||0})) : DEFAULT_OPTIONS;
  if(!o.length) o = DEFAULT_OPTIONS;
  const lab = {};
  if(wb.Sheets['Labels']) XLSX.utils.sheet_to_json(wb.Sheets['Labels']).forEach(r=>{ if(r.Key && r.Mizo) lab[String(r.Key)] = String(r.Mizo); });
  return {menu:parsed.length?parsed:DEFAULT_MENU, options:o, labels:lab};
}
function allLabelKeys(){
  const set = new Set(KEYS);
  document.querySelectorAll('[data-t]').forEach(el=>set.add(el.dataset.t));
  return [...set];
}
function menuWorkbook(m,o){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(m.map(x=>({Code:x.code,Category:x.category,Name:x.name,Price:x.price,HasOptions:x.hasOptions?'Y':'N'}))),'Menu');
  const vr = []; m.forEach(x=>(x.variants||[]).forEach(v=>vr.push({Code:x.code,Variant:v.name,Price:v.price})));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(vr.length?vr:[{Code:'',Variant:'',Price:''}]),'Variants');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(o.map(x=>({Option:x.name,ExtraPrice:x.extra}))),'Options');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allLabelKeys().map(k=>({Key:k,English:k,Mizo:labels[k]||''}))),'Labels');
  return wb;
}
async function autoLoad(){
  if(sync){   // shared mode: the sheet is the only source of the menu
    const c = load('pos_menu_cache',null);
    if(c){ menu = c.menu; options = c.options; fileLabels = c.labels||{}; } else { menu = []; }
    mergeLabels(); applyLang(); $('src').textContent = '· menu: loading shared menu…';
    let src;
    try{
      const st = await loadSheetMenu();
      if(st==='ok') src = 'Google Sheet';
      else if(st==='dirty') src = 'edited in Admin (uploading…)';
      else { if(!c){ menu = JSON.parse(JSON.stringify(DEFAULT_MENU)); options = DEFAULT_OPTIONS; } src = 'Google Sheet is empty → Admin → Push menu to sheet'; }
    }catch(e){ src = c ? 'Google Sheet (offline copy)' : '⚠️ cannot reach the shared sheet - check internet'; }
    $('src').textContent = '· menu: ' + src; mergeLabels(); applyLang(); return;
  }
  let fileWb = null;
  try{
    const res = await fetch('menu.xlsx?'+Date.now());
    if(res.ok) fileWb = XLSX.read(await res.arrayBuffer(),{type:'array'});
  }catch(e){}
  const saved = load('pos_menu',null);
  let src = 'built-in default';
  if(fileWb){ const r = parseWorkbook(fileWb); fileLabels = r.labels; menu = r.menu; options = r.options; src = 'menu.xlsx'; }
  if(saved){ menu = saved.menu; options = saved.options; src = 'edited in Admin'; }
  if(sync){
    try{ const st = await loadSheetMenu();
      src = st==='ok' ? 'Google Sheet' : st==='dirty' ? 'edited in Admin (uploading…)' : 'Google Sheet is empty → Admin → Push menu to sheet';
    }catch(e){
      const c = load('pos_menu_cache',null);
      if(c){ menu=c.menu; options=c.options; fileLabels=c.labels||{}; src='Google Sheet (offline copy)'; }
    }
  }
  $('src').textContent = '· menu: ' + src;
  mergeLabels(); applyLang();
}

let saving = false;
async function saveBill(payNow){
  if(!cart.length || saving) return;
  saving = true; $('btnSave').disabled = $('btnSavePay').disabled = true;
  try{
    const lines = cart.map(c=>({code:c.code,name:c.name,option:c.option,qty:c.qty,unit:c.unit,cat:c.cat}));
    const orderBy = $('selTaker').value, note = $('note').value.trim();
    let bill;
    if(editingId){
      const old = bills.find(b=>b.id===editingId);
      if(!old || old.status!=='open'){ alert('This bill was already paid or cancelled (maybe on another device).'); cart=[]; editingId=null; $('note').value=''; render(); return; }
      Object.assign(old,{lines,orderBy,note}); bill = old; touchBill(bill);
    } else {
      const no = await allocateNo();
      bill = {id:newId(),no,created:stamp(),status:'open',orderBy,note,lines,payment:'',cashier:'',cash:null,paidAt:'',rev:1};
      bills.push(bill); queueBill(bill.id);
    }
    save('pos_bills',bills);
    cart=[]; $('note').value=''; editingId=null;
    render(); updateBadge(); toast('✅ '+t('Bill saved')+' #'+bill.no+(payNow?'':' → '+t('Open bills')));
    kickSync();
    if(payNow) openPay(bill.id);
  } finally { saving = false; renderCart(); }
}

function openPay(id){

  payId = id; payMethod = 'Cash';
  document.querySelectorAll('#payTabs .tab').forEach(x=>x.classList.toggle('active',x.dataset.p==='Cash'));
  $('payTitle').textContent = '💰 ' + t('Pay Bill') + ' #' + b.no;

function updatePay(){
  const b = bills.find(x=>x.id===payId); if(!b) return;
  const tt = billTotal(b), cash = parseFloat($('cash').value)||0;
  $('cashBox').style.display = payMethod==='Cash' ? 'block' : 'none';

function printReceipt(b){
  const w = window.open('','_blank','width=320,height=600'); if(!w) return;
  const tt = billTotal(b);
  w.document.write(`<pre style="font:13px monospace">POS RECEIPT #${b.no}\nOrdered: ${escH(b.created)}\nPaid   : ${escH(b.paidAt)}\n--------------------------------\n`+
    b.lines.map(l=>`${escH(l.name)}${l.option?' ('+escH(l.option)+')':''}\n  ${l.qty} x ${money(l.unit)} = ${money(l.unit*l.qty)}`).join('\n')+
    `\n--------------------------------\nTOTAL  ${money(tt)}\nPAID BY ${b.payment.toUpperCase()}`+
    (b.payment==='Cash' ? `\nCASH   ${money(b.cash)}\nCHANGE ${money(b.cash-tt)}` : '')+
    (b.note ? `\nNOTE: ${escH(b.note)}` : '')+`\nOrder by: ${escH(b.orderBy||'-')}\nCashier : ${escH(b.cashier||'-')}\n\nThank you!</pre>`);
  w.document.close(); w.focus(); w.print();
}

  const dayList = Object.keys(days).sort().reverse();

  const sum = a=>a.reduce((s,b)=>s+billTotal(b),0);
  const list = days[histDay].slice().sort((a,b)=>b.no-a.no);
  const paid = list.filter(b=>b.status==='paid'), open = list.filter(b=>b.status==='open');

const SYNC_ACTIONS = {
  sSave: async ()=>{
    const url = (syncDraft.url||'').trim(), key = (syncDraft.key||'').trim();
    if(!/^https:\/\//.test(url) || !key) return alert('Enter the Web App URL (https://...) and the Key.');
    const old = sync; sync = {url,key};
    try{
      await api('ping',{},'GET');
      save('pos_sync',sync); syncErr='';
      bills.forEach(b=>queueBill(b.id));
      const st = await loadSheetMenu();
      markStaff();
      if(st==='empty' && confirm('Connected! The sheet menu is empty. Upload this device\'s menu to the sheet now?')) await pushMenu();
      else if(st==='ok'){ mergeLabels(); render(); $('src').textContent='· menu: Google Sheet'; }
      toast('☁️ Connected'); kickSync(); renderAdmin();
    }catch(e){ sync = old; alert('Could not connect: '+e.message+'\n\nCheck the URL (must end with /exec), the Key, and that the deployment access is "Anyone".'); }
  },
  sTest: async ()=>{
    const url = (syncDraft.url||'').trim(), key = (syncDraft.key||'').trim(); const old = sync; sync = {url,key};
    try{ await api('ping',{},'GET'); alert('✅ Connection OK'); }catch(e){ alert('❌ '+e.message); } finally{ sync = old; }
  },
  sPush: async ()=>{
    if(!sync) return alert('Connect first.');
    if(!confirm('Overwrite the Google Sheet menu with the menu saved on this device?')) return;
    try{ await pushMenu(); toast('☁️ Menu uploaded'); setSyncState(); }catch(e){ alert('Failed: '+e.message); }
  },
  sPull: async ()=>{
    if(!sync) return alert('Connect first.');
    try{ menuDirty=false; save('pos_menu_dirty',false); const st = await loadSheetMenu();
      if(st==='ok'){ mergeLabels(); render(); $('src').textContent='· menu: Google Sheet'; toast('⬇️ Menu loaded from sheet'); openAdmin(); } else alert('The sheet has no menu rows yet.');
    }catch(e){ alert('Failed: '+e.message); }
  },
  sBills: ()=>{ if(!sync) return alert('Connect first.'); bills.forEach(b=>queueBill(b.id)); kickSync(); toast('Uploading '+bills.length+' bills…'); },
  sLink: async ()=>{
    if(!sync) return alert('Connect first.');
    const link = location.origin+location.pathname+'#setup='+encodeURIComponent(btoa(JSON.stringify({u:sync.url,k:sync.key})));
    try{ await navigator.clipboard.writeText(link); toast('📋 Link copied - open it on the other device'); }catch(e){ prompt('Copy this link and open it on the other device:',link); }
  },
  sOff: ()=>{
    if(!confirm('Disconnect from Google Sheets? Bills stay on this device.')) return;
    sync = null; localStorage.removeItem('pos_sync'); syncErr=''; setSyncState(); renderAdmin();
  }
};
function variantsToText(m){ return (m.variants||[]).map(v=>v.name+'='+v.price).join(', '); }
function parseVariants(txt){
  return txt.split(/[,|;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const i = x.lastIndexOf('='); if(i<1) return null;
    const name = x.slice(0,i).trim(), price = parseFloat(x.slice(i+1));
    return (name && !isNaN(price)) ? {name,price} : null;
  }).filter(Boolean);
}

function adminInput(e){
  const el = e.target, row = el.dataset.row; if(!row) return;
  if(row==='m'){ const m = draft[el.dataset.i], f = el.dataset.f;
    m[f] = f==='price' ? (parseFloat(el.value)||0) : f==='hasOptions' ? el.checked : f==='variants' ? parseVariants(el.value) : el.value; }
  else if(row==='o'){ const o = draftOpts[el.dataset.i], f = el.dataset.f;
    o[f] = f==='extra' ? (parseFloat(el.value)||0) : el.value; }
  else if(row==='lab'){ draftLabels[el.dataset.k] = el.value; }
  else if(row==='sync'){ syncDraft[el.dataset.f] = el.value.trim(); }
}

$('adminBody').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.del==='m'){
    const m = draft[b.dataset.i];
    if(confirm('Delete "'+m.name+'" ('+m.code+')? Past bills keep their record.')){ draft.splice(b.dataset.i,1); renderAdmin(); }
  } else if(b.dataset.del==='o'){
    if(draftOpts.length<=1) return alert('At least one option is required');
    draftOpts.splice(b.dataset.i,1); renderAdmin();
  } else if(b.id==='addItem'){
    const cat = $('newCat').value, pre = PREFIX[cat];
    let idx = draft.findIndex(m=>m.category===cat && !String(m.name).trim());   // reuse an empty slot first
    if(idx<0){
      let max = 0; draft.forEach(m=>{ const c=m.code.toUpperCase(); if(c.startsWith(pre)){ const rest=c.slice(pre.length); if(/^\d+$/.test(rest)) max=Math.max(max,parseInt(rest)); } });
      draft.push({code:pre+String(max+1).padStart(2,'0'),category:cat,name:'',price:0,hasOptions:(cat==='Stir-fry'||cat==='Soup'),variants:[]});
      idx = draft.length-1;
    }
    renderAdmin();
    const inp = $('adminBody').querySelector(`input[data-row=m][data-i="${idx}"][data-f=name]`);
    inp.scrollIntoView({block:'center'}); inp.focus();
  } else if(b.id==='addOpt'){ draftOpts.push({name:'New option',extra:0}); renderAdmin(); }
  else if(b.id==='aImport'){ $('file').click(); }
  else if(b.id==='aDownload'){
    if(needXLSX()) return;
    mergeDraftLabels(); XLSX.writeFile(menuWorkbook(draft,draftOpts),'menu.xlsx');
  } else if(b.id==='aReset'){
    if(confirm('Remove the edits saved in this browser and reload menu.xlsx from GitHub?')){ localStorage.removeItem('pos_menu'); localStorage.removeItem('pos_labels'); location.reload(); }
  } else if(b.id==='setPin'){
    const p = $('newPin').value.trim(); if(p.length<4) return alert('PIN must be at least 4 characters');
    (async()=>{ try{ if(sync){ await api('savePin',{pin:p},'POST'); sheetPin=p; save('pos_sheet_pin',p); }
      save('pos_pin',p); $('newPin').value=''; toast('PIN updated'+(sync?' on all devices':'')); }
      catch(e){ alert('Could not update the PIN on the sheet: '+e.message); } })();
  } else if(b.id && SYNC_ACTIONS[b.id]){ SYNC_ACTIONS[b.id]();
  } else if(b.id==='clearHist'){
    const msg = sync ? 'Delete ALL bills from the Google Sheet and from every device? This cannot be undone. Export first!' : 'Delete ALL bills and sales history? Export to Excel first!';
    if(confirm(msg)){ (async()=>{
      try{ if(sync) await api('clearBills',{},'POST'); }catch(e){ return alert('Could not clear the sheet: '+e.message); }
      bills=[]; outbox=[]; save('pos_outbox',[]); save('pos_bills',[]); save('pos_counter',0); save('pos_sales',[]);
      cart=[]; editingId=null; updateBadge(); renderCart(); toast('History deleted'); })(); }
  }
});
function mergeDraftLabels(){ labels = Object.assign({}, labels); Object.entries(draftLabels).forEach(([k,v])=>{ v=v.trim(); if(v) labels[k]=v; else delete labels[k]; }); }
$('file').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return; if(needXLSX()) return;
  const wb = XLSX.read(await f.arrayBuffer(),{type:'array'});
  const r = parseWorkbook(wb);
  menu = r.menu; options = r.options; save('pos_menu',{menu,options});
  Object.assign(localLabels, r.labels); save('pos_labels',localLabels); mergeLabels();
  $('src').textContent = '· menu: edited in Admin'; e.target.value='';
  render(); openAdmin(); toast('Menu imported');
  if(sync){ menuDirty = true; save('pos_menu_dirty',true); pushMenu().catch(()=>{}); }
};
$('adminSave').onclick = ()=>{
  const codes = new Set();
  for(const m of draft){
    m.code = String(m.code).trim(); m.name = String(m.name).trim();
    if(!m.code) return alert('Every item needs a code');
    if(m.code.toUpperCase()==='OPEN') return alert('The code OPEN is reserved for Open item');
    m.variants = (m.variants||[]);
    if(codes.has(m.code.toLowerCase())) return alert('Duplicate code: '+m.code);
    codes.add(m.code.toLowerCase());
  }
  const opts = draftOpts.map(o=>({name:String(o.name).trim(),extra:Number(o.extra)||0})).filter(o=>o.name);
  if(!opts.length) return alert('At least one meat option is required');
  menu = JSON.parse(JSON.stringify(draft)); options = opts;
  save('pos_menu',{menu,options});
  localLabels = {}; Object.entries(draftLabels).forEach(([k,v])=>{ v=v.trim(); if(v) localLabels[k]=v; });
  save('pos_labels',localLabels); mergeLabels();
  $('src').textContent = '· menu: edited in Admin';
  render(); closeModals(); toast('✅ Saved');
  if(sync){ menuDirty = true; save('pos_menu_dirty',true);
    pushMenu().then(()=>{ toast('☁️ Menu saved to Google Sheet'); setSyncState(); }).catch(()=>toast('⚠️ Saved on this device - will upload when online')); }
};

setView('order');
$('syncDot').onclick = syncNow;
setSyncState();
setInterval(async()=>{   // pick up menu edits made in the sheet
  if(!sync || menuDirty || $('adminModal').style.display==='flex') return;
  try{ if(await loadSheetMenu()==='ok'){ mergeLabels(); render(); } }catch(e){}
}, 60000);
autoLoad().then(()=>setTimeout(syncNow,300));
</script>
